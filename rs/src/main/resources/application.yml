server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: referral-system
  datasource:
    type: org.apache.tomcat.jdbc.pool.DataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/referral?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root
    tomcat:
      initial-size: 5
      min-idle: 5
      max-active: 50
      max-idle: 20
      max-wait: 10000
      test-while-idle: true
      test-on-borrow: false
      validation-query: SELECT 1
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 60000
      remove-abandoned: true
      remove-abandoned-timeout: 60
      jdbc-interceptors: ConnectionState;StatementFinalizer
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ZmVhc2libGUtcmVmZXJyYWwtc3lzdGVtLWp3dC1zZWNyZXQta2V5LWZvci1obWFjLXNoYS0yNTYtdXNlLW9ubHk=
    expire-hours: 24
  upload:
    dir: ${user.dir}/uploads
    url-prefix: /uploads/

logging:
  level:
    root: INFO
    com.dahaiwuliang: DEBUG
