server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: referral-system
  datasource:
    url: jdbc:h2:mem:referral;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ZmVhc2libGUtcmVmZXJyYWwtc3lzdGVtLWp3dC1zZWNyZXQta2V5LWZvci1obWFjLXNoYS0yNTYtdXNlLW9ubHk=
    expire-hours: 24
  upload:
    dir: ${user.dir}/uploads
    url-prefix: /uploads/

logging:
  level:
    root: INFO
    com.dahaiwuliang: DEBUG
