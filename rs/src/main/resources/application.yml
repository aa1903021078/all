server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: yuequge-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zzx?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      # password: # 如无密码可注释
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.yuequge.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 文件上传本地静态目录
upload:
  # 物理路径
  path: ${user.home}/yuequge/uploads
  # 访问前缀
  url-prefix: /static

# JWT
jwt:
  secret: ${JWT_SECRET:yuequge-super-secret-key-for-jwt-token-please-change-in-prod-32bytes}
  expire-hours: 24
  header: Authorization
  prefix: "Bearer "

# 支付宝沙箱（题目给定值作为默认，生产请通过环境变量覆盖）
payment:
  order-timeout-minutes: 15
  alipay:
    enabled: true
    sandbox: true
    gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    app-id: ${ALIPAY_APP_ID:9021000143683773}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    notify-url: http://YOUR_SERVER_IP:8082/api/payments/alipay/notify
    return-url: http://localhost:5173/user-center
    sign-type: RSA2
    charset: UTF-8

# DeepSeek AI（题目给定值作为默认，生产请通过环境变量覆盖）
ai:
  enabled: true
  api-key: ${DEEPSEEK_API_KEY:sk-f73e6598d68443caa6b2405e369c662d}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat

# 测试账号（前端登录页回填展示用）
yuequge:
  test-users:
    - username: admin
      password: "123456"
      role: ADMIN
      desc: 管理员
    - username: user1
      password: "123456"
      role: USER
      desc: 普通用户
    - username: zzx
      password: "123456"
      role: USER
      desc: 测试用户 zzx

logging:
  level:
    root: INFO
    com.yuequge: DEBUG
